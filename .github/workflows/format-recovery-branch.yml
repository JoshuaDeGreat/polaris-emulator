name: Format recovery development branch

on:
  push:
    branches: [feature/heaven-password-recovery]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'JoshuaDeGreat/polaris-emulator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply project Java formatting
        working-directory: Emulator
        run: ./mvnw -B spotless:apply
      - name: Commit formatting changes to development branch only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Emulator/src/main/java Emulator/src/test/java
            git commit -m "style: apply Polaris formatter to recovery branch"
            git push origin HEAD:feature/heaven-password-recovery
          fi
