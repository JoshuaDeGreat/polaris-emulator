name: OVH staging Polaris artifact transfer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ovh-staging-polaris-transfer
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer verified Polaris build (no startup)
    runs-on: ubuntu-24.04
    environment: ovh-staging
    timeout-minutes: 15
    env:
      OVH_HOST: ${{ secrets.OVH_VPS_HOST }}
      OVH_KEY_B64: ${{ secrets.OVH_DEPLOY_SSH_KEY_B64 }}
      EXPECTED_FINGERPRINT: SHA256:9uEzPHDpmC7ToX1eNxt/4YOwkCswzsw/Dxhrj12Fj6U
      EXPECTED_JAR_SHA256: 50be62e60762f892adabd4b016ad95440bbc2c94235f4b1270c6501b45af6149
      RELEASE: polaris-40025074895
    steps:
      - name: Download previously verified Polaris artifact
        uses: actions/download-artifact@v4
        with:
          name: polaris-staging-jar
          run-id: 40025074895
          github-token: ${{ github.token }}
          path: artifact

      - name: Verify JAR and securely transfer to staging
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(artifact/*-jar-with-dependencies.jar)
          if [[ ${#jars[@]} -ne 1 || ! -s "${jars[0]}" ]]; then
            echo "::error::Expected exactly one nonempty Polaris JAR."
            exit 1
          fi
          echo "$EXPECTED_JAR_SHA256  ${jars[0]}" | sha256sum -c -

          if [[ -z "$OVH_HOST" || -z "$OVH_KEY_B64" || ! "$OVH_HOST" =~ ^[0-9.]+$ ]]; then
            echo "::error::Missing or invalid OVH staging secrets."
            exit 1
          fi
          key_file="$(mktemp "$RUNNER_TEMP/ovh-key.XXXXXXXX")"
          known_hosts="$(mktemp "$RUNNER_TEMP/ovh-known-hosts.XXXXXXXX")"
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          chmod 600 "$key_file" "$known_hosts"
          printf '%s' "$OVH_KEY_B64" | base64 --decode > "$key_file"
          ssh-keygen -y -P '' -f "$key_file" >/dev/null
          ssh-keyscan -T 10 -t ed25519 "$OVH_HOST" 2>/dev/null > "$known_hosts"
          if [[ "$(wc -l < "$known_hosts")" -ne 1 ]]; then
            echo "::error::Could not read exactly one SSH host key."
            exit 1
          fi
          actual="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk '{print $2}')"
          if [[ "$actual" != "$EXPECTED_FINGERPRINT" ]]; then
            echo "::error::VPS host fingerprint mismatch."
            exit 1
          fi

          ssh_opts=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=10)
          target="heaven-deploy@$OVH_HOST"
          ssh "${ssh_opts[@]}" "$target" "umask 027; mkdir -p ~/heaven-staging/releases/$RELEASE; chmod 750 ~/heaven-staging/releases/$RELEASE"
          scp "${ssh_opts[@]}" "${jars[0]}" "$target:heaven-staging/releases/$RELEASE/polaris.jar.part"
          ssh "${ssh_opts[@]}" "$target" "set -eu; cd ~/heaven-staging/releases/$RELEASE; echo '$EXPECTED_JAR_SHA256  polaris.jar.part' | sha256sum -c -; mv polaris.jar.part polaris.jar; chmod 640 polaris.jar; ls -lh polaris.jar"
          echo "Verified Polaris JAR transferred to unprivileged staging workspace. No container started."
